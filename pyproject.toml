[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fedgrid"
description = "Byzantine-robust federated learning for IEC 61850 smart substations with a spiking edge classifier"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Version is sourced from fedgrid.__init__ so the API /health endpoint and the
# package metadata can never drift apart.
dynamic = ["version"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "OpenDSSDirect.py>=0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    # Figure generation only (experiments/figures.py -> paper/figures/*.pdf). Kept
    # out of the runtime dependencies so `pip install fedgrid` never pulls a
    # plotting stack onto a training worker; the battery does not import it.
    "matplotlib>=3.8",
    # Shallow-probe baseline only (experiments/gbt_baseline.py -> the GBT row of
    # the reference frame and the frequency-channel ablation). Same rationale:
    # training workers never import it.
    "scikit-learn>=1.4",
]
# Vast.ai fleet controller only. Kept out of the core dependencies so a
# normal `pip install fedgrid` never pulls it; the operator invokes the CLI as
# a subprocess, so importing experiments.fleet.* also never requires this package.
fleet = [
    "vastai>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fedgrid.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
